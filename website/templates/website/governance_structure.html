{% extends 'website/base.html' %}
{% load static %}

{% block title %}الهيكل التنظيمي - جمعية إعمار الخيرية{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/governance_sub.css' %}">
<style>
.structure-image-container {
    max-width: 1200px;
    margin: 40px auto;
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
}

.structure-image {
    width: 100%;
    height: auto;
    border-radius: 12px;
    display: block;
}

.structure-download {
    margin-top: 24px;
    text-align: center;
}

.structure-download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #5ba8c8;
    color: #fff;
    padding: 12px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: background .3s, transform .3s;
}

.structure-download-btn:hover {
    background: #3a8aad;
    transform: translateY(-2px);
}

.structure-download-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
}

@media (max-width: 768px) {
    .structure-image-container {
        padding: 20px;
    }
}

.dark .structure-image-container {
    background: #1f2937;
}
</style>
{% endblock %}

{% block content %}
<section class="gsub-page">
  <div class="container">

    <!-- ── back link ── -->
    <div class="gsub-back-row">
      <a href="{% url 'website:governance' %}" class="gsub-back">
        العودة للحوكمة
        <svg class="gsub-back__arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>

    <!-- ── hero ── -->
    <div class="gsub-hero">
      <div class="gsub-hero__icon" style="background:#14b8a6;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </div>
      <h1 class="gsub-hero__title">الهيكل التنظيمي</h1>
      <p class="gsub-hero__sub">الهيكل التنظيمي لجمعية إعمار</p>
    </div>

    <!-- ══════════ الصورة ══════════ -->
    <div class="structure-image-container">
      <img src="{% static 'images/الهيكل_التنظيمي.webp' %}" alt="الهيكل التنظيمي - جمعية إعمار" class="structure-image">
      
      <div class="structure-download">
        <a href="{% static 'images/الهيكل_التنظيمي.webp' %}" download="الهيكل_التنظيمي_جمعية_إعمار.webp" class="structure-download-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          تحميل الصورة
        </a>
      </div>
    </div>

  </div>
</section>
{% endblock %}
