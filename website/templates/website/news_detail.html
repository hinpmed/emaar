{% extends 'website/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/news.css' %}">
{% endblock %}

{% block content %}
<section class="news-detail-section">
    <div class="container">

        <!-- Back Link -->
        <a href="{% url 'website:news' %}" class="news-detail-back">
            <svg class="news-detail-back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            العودة إلى الأخبار
        </a>

        <!-- Hero Image -->
        <div class="news-detail-hero">
            <img src="{% static news_item.image %}" alt="{{ news_item.title }}" class="news-detail-hero-img">
        </div>

        <!-- Article Content -->
        <article class="news-detail-article">
            <!-- Date -->
            <div class="news-detail-date">
                <svg class="news-date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>{{ news_item.date }}</span>
            </div>

            <!-- Title -->
            <h1 class="news-detail-title">{{ news_item.title }}</h1>

            <!-- Body -->
            <div class="news-detail-body">
                {{ news_item.body|safe }}
            </div>
        </article>
    </div>
</section>
{% endblock %}
